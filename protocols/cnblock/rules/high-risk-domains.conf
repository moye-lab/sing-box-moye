# high-risk-domains.conf — geosite-cn 规则集漏网的高风险国内域名（45 个）
# 每行一个域名；# 开头的行是注释，空行忽略。
# 收录规则：只收“登录即实名”的国内服务（银行/支付/政务/电信/出行/
# 电商/社交/AI/游戏/汽车等）；.cn 域名由 geosite-cn 的 tld-cn 自动覆盖，
# 不必列入；境外服务（哪怕是中资出海品牌）一律不列。
# 来源：2026-11-22 对照 domain-list-community 源码逐个核对 240 个候选
# 域名，44 个确认漏网，另加 deepseek.com（在源码里但 RN 实测经 WARP
# 漏网，写死兜底），合计 45 个。
# 改动后需重新开启拦截（sbx cnblock off && sbx cnblock on）才能生效。
# 若本文件缺失/不可读/为空，cnblock.sh 会回落到内嵌的同名清单，
# 拦截不失效。

